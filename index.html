<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque por Leitor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        input { width: 100%; padding: 15px; font-size: 18px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background: #eee; }
        button { margin-top: 15px; padding: 12px; font-size: 16px; cursor: pointer; }
        .remove-btn { padding: 5px 10px; background: #ff4d4d; color: white; border: none; cursor: pointer; }
        #status { margin-top: 10px; font-weight: bold; }
        #login-section { display: block; }
        #main-section { display: none; }

        .manual-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 2px solid #4CAF50;
        }
        .manual-section h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        .manual-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
    <div id="login-section">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <div id="login-status"></div>
    </div>

    <div id="main-section">
        <h2>📦 Controle de Estoque por Código de Barras</h2>
        
        <!-- Leitor de código de barras -->
        <input type="text" id="barcode" placeholder="Leia o código de barras aqui" autofocus>

        <!-- Entrada Manual -->
        <div class="manual-section">
            <h3>✍️ Entrada Manual</h3>
            <div class="manual-inputs">
                <div>
                    <input type="text" id="manual-codigo" placeholder="Código do Produto" maxlength="10">
                </div>
                <div>
                    <input type="number" id="manual-peso" placeholder="Peso (kg)" step="0.001" min="0">
                </div>
                <div>
                    <button onclick="adicionarManual()" style="padding: 15px 25px; background: #4CAF50; color: white; border: none; font-size: 16px;">
                        Adicionar
                    </button>
                </div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Código do Produto</th>
                    <th>Peso Total (kg)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>

        <div id="status">Carregando dados do Firebase...</div>
        
        <!-- Botões -->
        <button onclick="exportarCSV()">📤 Exportar para Excel</button>
        <button onclick="limparTodos()" style="background: #d32f2f; color: white;">🗑️ Limpar Todos os Produtos</button>
        <button onclick="logout()">Sair</button>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDJBdK9I-jtg9ujTc9Xsxr-hnPfkId4wIU",
            authDomain: "pdv1-77632.firebaseapp.com",
            databaseURL: "https://pdv1-77632-default-rtdb.firebaseio.com",
            projectId: "pdv1-77632",
            storageBucket: "pdv1-77632.firebasestorage.app",
            messagingSenderId: "246033791117",
            appId: "1:246033791117:web:7b70b511ea8d8c5ba1cac4",
            measurementId: "G-NTG13SG6VM"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const estoqueRef = db.ref("estoque");

        let estoque = {};
        const statusEl = document.getElementById("status");
        const loginStatusEl = document.getElementById("login-status");

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("main-section").style.display = "block";
                carregarDados();
            } else {
                document.getElementById("login-section").style.display = "block";
                document.getElementById("main-section").style.display = "none";
            }
        });

        function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    loginStatusEl.textContent = "Login bem-sucedido!";
                    loginStatusEl.style.color = "green";
                })
                .catch((error) => {
                    console.error(error);
                    loginStatusEl.textContent = "Erro no login: " + error.message;
                    loginStatusEl.style.color = "red";
                });
        }

        function logout() {
            auth.signOut();
        }

        function carregarDados() {
            estoqueRef.on("value", (snapshot) => {
                const data = snapshot.val();
                estoque = data || {};
                Object.keys(estoque).forEach(cod => {
                    if (typeof estoque[cod].pesoTotal !== 'number') {
                        delete estoque[cod];
                    } else {
                        delete estoque[cod].quantidade;
                    }
                });
                atualizarTabela();
                statusEl.textContent = "Dados sincronizados com o Firebase";
                statusEl.style.color = "green";
            });
        }

        // Leitor de código de barras
        document.getElementById("barcode").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                let codigo = this.value.trim();
                this.value = "";

                if (codigo.length < 11 || codigo[0] !== "2") {
                    alert("Código inválido");
                    return;
                }

                let codProduto = codigo.substring(1, 5);
                let pesoFinal = parseInt(codigo.slice(-6));
                if (isNaN(pesoFinal)) {
                    alert("Peso inválido no código");
                    return;
                }

                let pesoKg = pesoFinal / 10000;
                adicionarPeso(codProduto, pesoKg);
            }
        });

        // Entrada Manual
        function adicionarManual() {
            const codInput = document.getElementById("manual-codigo");
            const pesoInput = document.getElementById("manual-peso");

            let codProduto = codInput.value.trim();
            let pesoKg = parseFloat(pesoInput.value);

            if (!codProduto) {
                alert("Digite o código do produto");
                codInput.focus();
                return;
            }
            if (isNaN(pesoKg) || pesoKg <= 0) {
                alert("Digite um peso válido (maior que zero)");
                pesoInput.focus();
                return;
            }

            adicionarPeso(codProduto, pesoKg);
            codInput.value = "";
            pesoInput.value = "";
            codInput.focus();
        }

        function adicionarPeso(codProduto, pesoKg) {
            if (!estoque[codProduto]) {
                estoque[codProduto] = { pesoTotal: 0 };
            }
            estoque[codProduto].pesoTotal += pesoKg;

            estoqueRef.set(estoque).then(() => {
                atualizarTabela();
            }).catch((error) => {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar no Firebase");
            });
        }

        // ==================== NOVA FUNÇÃO: LIMPAR TODOS ====================
        function limparTodos() {
            if (confirm("⚠️ Tem certeza que deseja REMOVER TODOS os produtos do estoque?\n\nEsta ação não pode ser desfeita!")) {
                estoque = {};
                estoqueRef.set(estoque)
                    .then(() => {
                        atualizarTabela();
                        statusEl.textContent = "Todos os produtos foram removidos!";
                        statusEl.style.color = "orange";
                    })
                    .catch((error) => {
                        console.error("Erro ao limpar:", error);
                        alert("Erro ao limpar o estoque: " + error.message);
                    });
            }
        }

        function removerItem(cod) {
            if (confirm(`Tem certeza que deseja remover o item ${cod}?`)) {
                delete estoque[cod];
                estoqueRef.set(estoque).then(atualizarTabela);
            }
        }

        function atualizarTabela() {
            let tbody = document.getElementById("tabela");
            tbody.innerHTML = "";
            let keys = Object.keys(estoque).sort((a, b) => a.localeCompare(b));
            for (let cod of keys) {
                if (typeof estoque[cod].pesoTotal === 'number') {
                    let pesoFormatado = estoque[cod].pesoTotal.toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
                    tbody.innerHTML += `
                        <tr>
                            <td>${cod}</td>
                            <td>${pesoFormatado}</td>
                            <td><button class="remove-btn" onclick="removerItem('${cod}')">Remover</button></td>
                        </tr>
                    `;
                }
            }
        }

        function exportarCSV() {
            let csv = "Código do Produto;Peso Total (kg)\n";
            let keys = Object.keys(estoque).sort((a, b) => a.localeCompare(b));
            for (let cod of keys) {
                if (typeof estoque[cod].pesoTotal === 'number') {
                    let pesoStr = estoque[cod].pesoTotal.toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
                    csv += `${cod};${pesoStr}\n`;
                }
            }
            let bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            let blob = new Blob([bom, csv], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "estoque.csv";
            link.click();
        }
    </script>
</body>
</html>
